version: '3.8'

services:
  gsk_poc_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: asd_alley/gsk_poc_api:v1
    hostname: gsk_poc_api
    container_name: gsk_poc_api
    env_file:
      - .env
    ports:
      - "8000:8000"  # 将主机的 8000 端口映射到容器的 8000 端口
    volumes:
      - ./app:/app/app  # 将主机的 app 目录挂载到容器中
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped